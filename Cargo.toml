[package]
name = "reword-cli"
version = "0.1.0"
edition = "2024"
description = "A plain-text flashcard CLI with FSRS spaced repetition"
license = "Apache-2.0"
repository = "https://github.com/joshuamotoaki/reword"
readme = "README.md"
keywords = ["flashcards", "spaced-repetition", "fsrs", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "reword"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dependencies]
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.5"
crossterm = "0.29.0"
fsrs = "6.6.2"
jiff = "0.2.35"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.5"
unicode-normalization = "0.1.25"
unicode-width = "0.2.2"

[dev-dependencies]
tempfile = "3.27.0"
